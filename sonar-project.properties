# https://docs.sonarcloud.io/advanced-setup/analysis-scope/
# sonar.projectName=dynamically set in workflow
# sonar.projectKey=dynamically set in workflow
# sonar.projectKey=dbb-software_platform-base
# sonar.organization=dbb-software
sonar.host.url=https://sonarcloud.io
# sonar.projectName=DBBS Platform Base

sonar.sources=apps, packages

sonar.test.inclusions=**/*.spec.ts, **/*.e2e-spec.ts, **/*.test.ts, **/*.test.tsx, **/*.spec.tsx

sonar.exclusions=node_modules/**, \
   **/*.test.ts, \
   **/*.test.tsx, \
   **/*.spec.ts, \
   **/*.spec.tsx, \
   **/*.stories.tsx, \
   **/main.ts, \
   **/cluster.ts, \
   **/*.e2e-spec.ts, \
   **/*.config.ts, \
   **/constants.ts, \
   **/*.config.cjs, \
   **/*.kt, \
   **/__tests__/**, \
   **/e2e/**, \
   **/cypress/**, \
   **/main.tsx, \
   **/*config.js, \
   **/*.gen.ts, \
   apps/mobile/**

sonar.coverage.exclusions=**/*.config.ts, \
   **/*.config.js, \
   **/*.config.mjs, \
   **/main.ts, \
   **/main.tsx, \
   **/index.ts, \
   **/*.test.ts, \
   **/*.test.tsx, \
   **/*.spec.ts, \
   **/*.spec.tsx, \
   turbo/generators/**, \
   packages/vitest-config/src/**, \
   apps/mobile/**

sonar.javascript.lcov.reportPaths=apps/**/coverage/lcov.info, packages/**/coverage/lcov.info

sonar.typescript.tsconfigPath=tsconfig.json

# S5332 (clear-text protocol) on the env schema is a false positive:
# the CORS_ORIGIN *default* is localhost dev/test only (there is no TLS
# on localhost without certs). Production supplies https origins via the
# CORS_ORIGIN env var — the default is never used in a deployed env.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=apps/api/src/config/env.ts

# Disable analysis for C, C++, and Objective-C (from node_modules)
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-
